name: Firmware tools

on:
  push:
    branches: ['**']
    paths: ['firmware-tools/**', '.github/workflows/firmware-tools.yml']
  pull_request:
    paths: ['firmware-tools/**', '.github/workflows/firmware-tools.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m unittest discover -v firmware-tools
